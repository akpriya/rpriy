<template>
    <lightning-card title="Calculator" icon-name="standard:event">
        <div class="slds-var-p-around_medium">
            <lightning-input type="text" label="Number 1" name="number1" placeholder="Enter Number 1" value={numberOne} onchange={changeHandler}>
            </lightning-input>
            <lightning-input type="text" label="Number 2" name="number2" placeholder="Enter Number 2" value={numberTwo} onchange={changeHandler}>
            </lightning-input>
        </div>
        <div>
            <lightning-button variant="brand" label="Add" title="Perform Addition" class="slds-var-p-around_medium" onclick={calculateHandler}></lightning-button>
            <lightning-button variant="brand" label="Sub" title="Perform Subtraction" class="slds-var-p-around_medium" onclick={calculateHandler}></lightning-button>
            <lightning-button variant="brand" label="Mul" title="Perform Multiplication" class="slds-var-p-around_medium" onclick={calculateHandler}></lightning-button>
            <lightning-button variant="brand" label="Div" title="Perform Division" class="slds-var-p-around_medium" onclick={calculateHandler}></lightning-button>
        </div>
        <template lwc:if={displayResult}>
            <div class="slds-var-p-around_medium">
                <p>Output : {result}</p>
            </div>
        </template>
    </lightning-card>
</template>
