<template>
    <lightning-card title="Lightning component using Wire Decorators">
        <div class="slds-grid slds-gutters">
            <div class="slds-col slds-size_1-of-2 propertydiv">
                <lightning-card title="Wire Decorators Using Property">
                    <lightning-datatable key-field="id" data={accounts.data} columns={columns}>
                    </lightning-datatable>
                </lightning-card>
            </div>
            <div class="slds-col slds-size_1-of-2 functiondiv">
                <lightning-card title="Wire Decorators Using Function">
                    <template lwc:if={accounts}>
                        <lightning-datatable key-field="id" data={accountsfn} columns={columns}>
                        </lightning-datatable>
                    </template>
                    <template lwc:elseif={errors}>
                        <c-error-panel errors={errors}></c-error-panel>
                    </template>
                </lightning-card>
            </div>
        </div>
    </lightning-card>
</template>
