<template>
    <div class="slds-grid slds-gutters">
        <div class="slds-col">
            <lightning-card title="Add New Task">
                <lightning-input type="text" label="Enter Task" name="taskname" value={taskname} class="taskname"
                    message-when-value-missing="Kindly Enter Task Name" placeholder="Enter Task Name"
                    onchange={changeHandler} required>
                </lightning-input>
                <lightning-input field-level-help="Default End Date is Today's Date" type="date" label="Set End Date"
                    name="taskdate" placeholder="Set Task End Date" value={taskdate} onchange={changeHandler}>
                </lightning-input>
                <div class="slds-var-p-around_small">
                    <lightning-button class="slds-var-p-around_small" variant="brand" label="Reset"
                        onclick={resetHandler}>
                    </lightning-button>
                    <lightning-button class="slds-var-p-around_small" variant="brand" label="Add Task"
                        onclick={addTaskHandler}>
                    </lightning-button>
                </div>

            </lightning-card>
        </div>
        <div class="slds-col">
            <lightning-card title="To Do List">
                <div class="slds-var-p-around_small">
                    <template for:each={incompletedtask} for:item="currTask" for:index="index">
                        <div key={currTask.taskname} class="slds-box slds-theme_shade">
                            <div class="slds-grid slds-wrap">
                                <div class="slds-col slds-size_8-of-12">
                                    <p>{currTask.taskname}</p>
                                    <p><lightning-formatted-date-time value={currTask.taskdate} year="2-digit"
                                            month="short" day="2-digit" weekday="long"></lightning-formatted-date-time>
                                    </p>
                                </div>
                                <div class="slds-col slds-size_4-of-12">
                                    <lightning-button-icon icon-name="utility:delete" alternative-text="Delete"
                                        class="slds-m-left_xx-small" title="Delete" onclick={removeHandler}>
                                    </lightning-button-icon>
                                    <lightning-button-icon icon-name="utility:check" alternative-text="Check"
                                        class="slds-m-left_xx-small" title="Check Completed"
                                        onclick={completeTaskHandler}>
                                    </lightning-button-icon>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </lightning-card>
        </div>
        <div class="slds-col">
            <lightning-card title="Completed Items">
            </lightning-card>
        </div>
    </div>
</template>
